<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finance OS — Design System</title>
    <link rel="icon" type="image/png" href="/logo-square-blue.png" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --blue: #33488f; --ink: #14161b; --muted: #474e5c; --line: #e6e8ec; --bg: #f6f7f9; --card: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; padding: 28px;
        box-shadow: 0 1px 2px -1px rgba(16, 19, 27, 0.06), 0 12px 32px -16px rgba(16, 19, 27, 0.16);
      }
      img { width: 44px; height: 44px; border-radius: 8px; display: block; }
      h1 { font-size: 18px; margin: 16px 0 4px; letter-spacing: -0.01em; }
      p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 20px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
      input {
        width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
        font-size: 14px; background: #fff; color: var(--ink);
      }
      input:focus { outline: 2px solid var(--muted); outline-offset: 2px; }
      button {
        width: 100%; margin-top: 16px; padding: 10px 12px; border: 0; border-radius: 6px;
        background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .err { color: #a81e23; font-size: 13px; margin-top: 12px; min-height: 18px; }
      .meta {
        margin-top: 18px; font-size: 11px; color: var(--muted); text-align: center;
        letter-spacing: 0.08em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <form class="card" id="f">
      <img src="/logo-square-blue.png" alt="Finance OS" />
      <h1>Finance OS — Design System</h1>
      <p>Private &amp; confidential. Enter the access password to continue.</p>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" autofocus required />
      <button id="b" type="submit">Enter</button>
      <div class="err" id="e" role="alert"></div>
      <div class="meta">Private &amp; Confidential</div>
    </form>
    <script>
      const f = document.getElementById('f'),
        b = document.getElementById('b'),
        e = document.getElementById('e')
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault()
        e.textContent = ''
        b.disabled = true
        b.textContent = 'Checking…'
        try {
          const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('p').value }),
          })
          if (r.ok) {
            location.href = '/'
          } else {
            const j = await r.json().catch(() => ({}))
            e.textContent =
              j.error === 'too_many_attempts'
                ? 'Too many attempts. Wait a few minutes.'
                : j.error === 'not_configured'
                  ? 'The gate is not configured yet.'
                  : 'Incorrect password.'
            b.disabled = false
            b.textContent = 'Enter'
          }
        } catch {
          e.textContent = 'Network error. Try again.'
          b.disabled = false
          b.textContent = 'Enter'
        }
      })
    </script>
  </body>
</html>
